<style>
:root {
  --bg: #f7f9fb;
  --card: #ffffff;
  --text: #0f172a;
  --muted: #6b7280;
  --accent: #2563eb;
  --accent-strong: #1d4ed8;
  --border: #e5e7eb;
  --success: #16a34a;
  --danger: #dc2626;
  --warning: #f59e0b;
  --input-bg: #f8fafc;
  --shadow-soft: 0 12px 30px rgba(17, 24, 39, 0.08);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
}

.app-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  max-width: 960px;
  margin: 0 auto;
  padding: 2rem 1.5rem 3rem;
}

.app-header {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  margin-bottom: 1.5rem;
}

.app-header h1 {
  font-size: 1.75rem;
  margin: 0;
}

.subtitle {
  color: var(--muted);
  margin: 0;
}

.top-nav {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.75rem 1rem;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}

.logo {
  font-weight: 700;
  letter-spacing: -0.01em;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.nav-link {
  padding: 0.55rem 0.85rem;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 10px;
  color: var(--text);
  font-weight: 600;
  cursor: pointer;
  transition: background 120ms ease, color 120ms ease, border-color 120ms ease, transform 120ms ease;
}

.nav-link:hover,
.nav-link:focus-visible {
  background: #eef2ff;
  border-color: #e0e7ff;
  outline: none;
  transform: translateY(-1px);
}

.nav-link.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.25);
}

.main-container {
  max-width: 960px;
  margin: 1.5rem auto 2.5rem;
  padding: 0 1rem;
  display: grid;
  gap: 1.25rem;
}

.page-section {
  display: none;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1.25rem;
  box-shadow: var(--shadow-soft);
}

.page-section.active {
  display: block;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
  margin-bottom: 0.75rem;
}

.section-subtitle {
  margin: 0;
  color: var(--muted);
  font-size: 0.95rem;
}

.status-legends {
  display: inline-flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.5rem 0.75rem;
  background: #f8fafc;
  border: 1px solid var(--border);
  border-radius: 12px;
}

.status-item {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  color: var(--muted);
  font-weight: 600;
}

.status-icon {
  display: inline-flex;
  width: 24px;
  height: 24px;
  align-items: center;
  justify-content: center;
}

.status-icon svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

.status-icon.paid {
  color: var(--success);
}

.status-icon.overdue {
  color: var(--danger);
}

.status-icon.due-soon {
  color: var(--warning);
}

.dashboard-placeholder,
.content-placeholder {
  padding: 1rem;
  border: 1px dashed var(--border);
  border-radius: 10px;
  color: var(--muted);
  background: #f9fafb;
}

.dashboard-placeholder {
  min-height: 120px;
}

.content-placeholder {
  min-height: 100px;
}

.content-block {
  background: #f8fafc;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1rem 1.25rem;
}

.form-field {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.form-field label {
  font-weight: 600;
  color: #111827;
  font-size: 0.95rem;
}

.form-field input,
.form-field select,
.form-field textarea {
  padding: 0.65rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--input-bg);
  font: inherit;
  color: var(--text);
  transition: border-color 120ms ease, box-shadow 120ms ease, background 120ms ease;
}

.form-field input:focus,
.form-field select:focus,
.form-field textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  background: #fff;
}

.form-field textarea {
  resize: vertical;
  min-height: 90px;
}

.checkbox-inline {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.checkbox-inline input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
}

.form-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  grid-column: 1 / -1;
  margin-top: 0.25rem;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.65rem 1rem;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
}

.btn-primary {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
}

.btn-primary:hover {
  transform: translateY(-1px);
  background: var(--accent-strong);
}

.section-description {
  color: var(--muted);
  margin-top: 0;
}

#toast-container {
  position: fixed;
  bottom: 1.25rem;
  right: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  pointer-events: none;
  z-index: 20;
}

.toast {
  min-width: 240px;
  padding: 0.75rem 1rem;
  border-radius: 12px;
  background: #111827;
  color: #f9fafb;
  box-shadow: 0 20px 40px rgba(15, 23, 42, 0.25);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 200ms ease, transform 200ms ease;
  pointer-events: auto;
}

.toast.visible {
  opacity: 1;
  transform: translateY(0);
}

.toast.toast-success {
  background: var(--success);
}

.toast.toast-error {
  background: var(--danger);
}

.toast.toast-info {
  background: var(--accent);
}

@media (max-width: 720px) {
  .top-nav {
    flex-direction: column;
    align-items: flex-start;
  }

  .nav-links {
    width: 100%;
    flex-wrap: wrap;
  }

  .nav-link {
    flex: 1 1 auto;
    text-align: center;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  #toast-container {
    right: 0.75rem;
    left: 0.75rem;
  }
}
</style>
