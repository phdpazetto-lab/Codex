<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('appV2/Styles'); ?>
  </head>
  <body>
    <div class="app">
      <header class="app__header">
        <h1>Finance Ops v2</h1>
        <div class="app__controls">
          <label>Month (YYYY-MM)</label>
          <input type="month" id="monthInput" />
          <button id="refreshBtn">Load</button>
        </div>
      </header>
      <section class="app__section">
        <h2>Operational Month View</h2>
        <div class="filters">
          <select id="statusFilter">
            <option value="">Status: All</option>
            <option value="OPEN">Open</option>
            <option value="PAID">Paid</option>
            <option value="CANCELLED">Cancelled</option>
          </select>
          <input type="text" id="accountFilter" placeholder="Account filter" />
          <input type="text" id="categoryFilter" placeholder="Category filter" />
        </div>
        <table id="instancesTable" class="table">
          <thead>
            <tr>
              <th>Bill</th>
              <th>Account</th>
              <th>Category</th>
              <th>Due</th>
              <th>Predicted</th>
              <th>Actual</th>
              <th>Status</th>
              <th>Paid At</th>
              <th>Method</th>
              <th>Notes</th>
              <th>Overdue</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section class="app__section">
        <h2>One-Off Entry</h2>
        <form id="oneOffForm" class="form-grid">
          <input name="name" placeholder="Name" required />
          <input name="account" placeholder="Account" required />
          <input name="category" placeholder="Category" required />
          <input name="month_ref" placeholder="YYYY-MM" required />
          <input name="due_date" type="date" required />
          <input name="predicted_value" type="number" step="0.01" placeholder="Predicted" required />
          <input name="actual_value" type="number" step="0.01" placeholder="Actual (optional)" />
          <input name="payment_method" placeholder="Payment method" />
          <input name="supplier" placeholder="Supplier" />
          <input name="notes" placeholder="Notes" />
          <select name="status">
            <option value="OPEN">OPEN</option>
            <option value="PAID">PAID</option>
            <option value="CANCELLED">CANCELLED</option>
          </select>
          <button type="submit">Add One-Off</button>
        </form>
      </section>

      <section class="app__section">
        <h2>KPIs</h2>
        <div id="kpiBar" class="kpi-bar"></div>
      </section>
    </div>
    <?!= include('appV2/Scripts'); ?>
  </body>
</html>
