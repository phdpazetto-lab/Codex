<script type="module">
// StarPay WebApp controller: routing, GAS calls, rendering and forms.

const state = {
  currentSection: 'home',
  filtros: {
    status: '',
    tipoPessoa: '',
    vencimentoInicio: '',
    vencimentoFim: '',
  },
  datasets: {
    contasFixas: [],
    contasMes: [],
  },
};

const SELECTORS = {
  navLink: '.nav-link',
  pageSection: '.page-section',
  featureCard: '[data-section-card]',
  contasFixasLista: '#lista-contas-fixas',
  contasMesTabela: '#tabela-contas-mes',
  toastContainer: '#toast-container',
};

function showToast(message, variant = 'info', duration = 3000) {
  const container = document.querySelector(SELECTORS.toastContainer);
  if (!container) return;

  const toast = document.createElement('div');
  toast.className = `toast ${variant}`;
  toast.textContent = message;
  container.appendChild(toast);

  requestAnimationFrame(() => {
    toast.classList.add('visible');
  });

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(6px)';
    setTimeout(() => toast.remove(), 180);
  }, duration);
}

function setLoading(target, isLoading, message = 'Carregando...') {
  const container = typeof target === 'string' ? document.querySelector(target) : target;
  if (!container) return;

  let overlay = container.querySelector('.loading-state');
  if (isLoading) {
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.className = 'loading-state';
      overlay.innerHTML = `
        <div class="spinner" aria-hidden="true"></div>
        <p class="loading-message">${message}</p>
      `;
      container.appendChild(overlay);
    }
    container.classList.add('is-loading');
    const messageEl = overlay.querySelector('.loading-message');
    if (messageEl) messageEl.textContent = message;
  } else {
    container.classList.remove('is-loading');
    overlay?.remove();
  }
}

  function callServer(fn, ...args) {
    return new Promise((resolve, reject) => {
      const runner = (typeof google !== 'undefined' && google.script && google.script.run) || null;
      if (!runner) {
        const message = `Função de servidor indisponível: ${fn}`;
        console.warn(message);
        reject(new Error(message));
        return;
      }

      runner.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
}

const gasClient = {
  listarContasFixas: () => callServer('listarContasFixas'),
  criarContaFixa: (payload) => callServer('criarContaFixa', payload),
  criarContaPontual: (payload) => callServer('criarContaPontual', payload),
  listarContasMes: (payload) => callServer('listarContasMes', payload),
  atualizarContaMensal: (payload) => callServer('atualizarContaMensal', payload),
  marcarPago: (id, dataPagamento, valorReal, metodo, observacoes) =>
    callServer('marcarPago', id, dataPagamento, valorReal, metodo, observacoes),
  gerarMes: () => callServer('gerarMes'),
};

function navigateToSection(target) {
  updateActiveSection(target);
  window.location.hash = `#${state.currentSection}`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setupRouting() {
  document.querySelectorAll(SELECTORS.navLink).forEach((link) => {
    link.addEventListener('click', (event) => {
      event.preventDefault();
      const target = link.dataset.section;
      navigateToSection(target);
    });
  });

  document.querySelectorAll(SELECTORS.featureCard).forEach((card) => {
    card.addEventListener('click', (event) => {
      event.preventDefault();
      const target = card.dataset.sectionCard;
      navigateToSection(target);
    });
  });

  window.addEventListener('hashchange', () => {
    const hashTarget = window.location.hash.replace('#', '');
    updateActiveSection(hashTarget || 'home');
  });

  const initialHash = window.location.hash.replace('#', '');
  updateActiveSection(initialHash || state.currentSection);
}

function updateActiveSection(sectionId) {
  const validSection = sectionId && document.getElementById(sectionId) ? sectionId : 'home';
  state.currentSection = validSection;
  document.querySelectorAll(SELECTORS.navLink).forEach((link) => {
    const isActive = link.dataset.section === state.currentSection;
    link.classList.toggle('active', isActive);
    if (isActive) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });

  document.querySelectorAll(SELECTORS.pageSection).forEach((section) => {
    const isActive = section.id === state.currentSection;
    section.classList.toggle('active', isActive);
  });
}

function normalizeBoolean(value) {
  const normalized = String(value || '')
    .normalize('NFD')
    .replace(/\p{Diacritic}/gu, '')
    .toUpperCase();
  return normalized === 'SIM' || normalized === 'YES' || normalized === 'TRUE';
}

function parseNumeric(value) {
  if (typeof value === 'number') return value;
  if (value === null || value === undefined) return 0;
  const sanitized = String(value).replace(/[^0-9,.-]/g, '').replace(',', '.');
  const parsed = Number.parseFloat(sanitized);
  return Number.isFinite(parsed) ? parsed : 0;
}

function statusInfo(conta) {
  const pago = normalizeBoolean(conta.PAGO || conta.pago);
  const atrasado = normalizeBoolean(conta.ATRASADO || conta.atrasado);
  const vencimentoValor = conta.VENCIMENTO || conta.vencimento;
  const dataPagamento = conta.DATA_PAGAMENTO || conta.dataPagamento;
  const vencimento = vencimentoValor ? new Date(vencimentoValor) : null;
  const hoje = new Date();
  hoje.setHours(0, 0, 0, 0);
  const diasParaVencer = vencimento ? Math.round((vencimento - hoje) / (1000 * 60 * 60 * 24)) : null;

  if (pago) {
    return {
      key: 'pago',
      label: 'Pago',
      detail: dataPagamento ? `Pago em ${formatDate(dataPagamento)}` : 'Baixado',
    };
  }

  if (atrasado || (vencimento && vencimento < hoje)) {
    return { key: 'atrasado', label: 'Atrasado', detail: vencimento ? `Venceu em ${formatDate(vencimento)}` : 'Em atraso' };
  }

  if (diasParaVencer !== null && diasParaVencer <= 3) {
    const diasLabel = diasParaVencer === 0 ? 'Vence hoje' : `Vence em ${diasParaVencer} dia(s)`;
    return { key: 'vencendo', label: 'Vencendo', detail: diasLabel };
  }

  return { key: 'aberto', label: 'Em aberto', detail: 'Dentro do prazo' };
}

function updateHomeKpis() {
  const totalPrevistoEl = document.getElementById('kpi-previsto');
  const totalPagoEl = document.getElementById('kpi-pago');
  const totalAbertoEl = document.getElementById('kpi-em-aberto');
  const totalAtrasadoEl = document.getElementById('kpi-atrasado');

  if (!totalPrevistoEl) return;

  const resumo = state.datasets.contasMes.reduce(
    (acc, item) => {
      const valorPrevisto = parseNumeric(item.VALOR_PREVISTO || item.valor_previsto || item.valorPrevisto);
      const valorReal = parseNumeric(item.VALOR_REAL || item.valorReal);
      const pago = normalizeBoolean(item.PAGO || item.pago);
      const atrasado = normalizeBoolean(item.ATRASADO || item.atrasado);

      acc.previsto += valorPrevisto;
      if (pago) {
        acc.pago += valorReal || valorPrevisto;
      } else {
        acc.emAberto += valorPrevisto;
      }
      if (atrasado && !pago) acc.atrasados += 1;
      return acc;
    },
    { previsto: 0, pago: 0, emAberto: 0, atrasados: 0 }
  );

  totalPrevistoEl.textContent = formatCurrency(resumo.previsto);
  totalPagoEl.textContent = formatCurrency(resumo.pago);
  totalAbertoEl.textContent = formatCurrency(resumo.emAberto);
  totalAtrasadoEl.textContent = `${resumo.atrasados} ${resumo.atrasados === 1 ? 'conta' : 'contas'}`;
}

function formatCurrency(value) {
  const number = Number(value || 0);
  return number.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function formatDate(value) {
  if (!value) return '—';
  const date = value instanceof Date ? value : new Date(value);
  if (Number.isNaN(date.getTime())) return value;
  return date.toLocaleDateString('pt-BR');
}

function renderContasFixas() {
  const container = document.querySelector(SELECTORS.contasFixasLista);
  if (!container) return;

  if (!state.datasets.contasFixas.length) {
    container.innerHTML = '<p class="muted">Nenhuma conta fixa cadastrada ainda.</p>';
    return;
  }

  const table = document.createElement('table');
  table.className = 'list-table';
  table.innerHTML = `
    <thead>
      <tr>
        <th>Nome</th>
        <th>Categoria</th>
        <th>PF/PJ</th>
        <th>Valor</th>
        <th>Dia</th>
        <th>Pagamento</th>
      </tr>
    </thead>
    <tbody></tbody>
  `;

  const tbody = table.querySelector('tbody');
  state.datasets.contasFixas.forEach((conta) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${conta.nome_conta || conta.nomeConta}</td>
      <td>${conta.categoria}</td>
      <td>${conta.tipo_pessoa || conta.tipoPessoa}</td>
      <td>${formatCurrency(conta.valor_previsto || conta.valorPrevisto)}</td>
      <td>${conta.dia_recorrecia || conta.diaRecorrencia}</td>
      <td>${conta.metodo_pagamento || conta.metodoPagamento || '—'}</td>
    `;
    tbody.appendChild(tr);
  });

  container.innerHTML = '';
  container.appendChild(table);
}

function openContaEditor(conta, options = {}) {
  const idMensal = conta?.ID_MENSAL || conta?.id_mensal || conta?.idMensal;
  if (!idMensal) {
    showToast('ID da conta não encontrado.', 'error');
    return;
  }

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  const valorPrevisto = parseNumeric(conta.VALOR_PREVISTO || conta.valorPrevisto);
  const valorRealAtual = parseNumeric(conta.VALOR_REAL || conta.valorReal);
  const pagoDefault = options.pagar || normalizeBoolean(conta.PAGO || conta.pago);
  const dataPagamentoValor = conta.DATA_PAGAMENTO || conta.dataPagamento;
  const dataPagamentoISO = dataPagamentoValor
    ? new Date(dataPagamentoValor).toISOString().split('T')[0]
    : options.pagar
      ? new Date().toISOString().split('T')[0]
      : '';

  overlay.innerHTML = `
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="Editar conta mensal">
      <header class="modal-card__header">
        <div>
          <p class="eyebrow">${conta.CATEGORIA || conta.categoria || 'Conta'}</p>
          <h2>${conta.NOME_CONTA || conta.nomeConta}</h2>
        </div>
        <button type="button" class="btn btn-ghost" data-close>&times;</button>
      </header>
      <form class="modal-form">
        <div class="form-row">
          <label>Valor previsto</label>
          <div class="pill-highlight">${formatCurrency(valorPrevisto)}</div>
        </div>
        <div class="form-row">
          <label for="valorReal">Valor real</label>
          <input id="valorReal" name="valorReal" type="number" step="0.01" min="0" value="${valorRealAtual || ''}" />
        </div>
        <div class="form-row">
          <label for="dataPagamento">Data de pagamento</label>
          <input id="dataPagamento" name="dataPagamento" type="date" value="${dataPagamentoISO}" />
        </div>
        <div class="form-row">
          <label for="metodoPagamento">Método</label>
          <input id="metodoPagamento" name="metodoPagamento" type="text" value="${conta.METODO_PAGAMENTO || conta.metodoPagamento || ''}" />
        </div>
        <div class="form-row">
          <label for="observacoes">Observações</label>
          <textarea id="observacoes" name="observacoes" rows="2">${conta.OBSERVACOES || conta.observacoes || ''}</textarea>
        </div>
        <label class="checkbox-field">
          <input type="checkbox" name="pago" ${pagoDefault ? 'checked' : ''} />
          <span>Marcar como pago</span>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" data-close>Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  `;

  function closeModal() {
    overlay.remove();
  }

  overlay.addEventListener('click', (event) => {
    if (event.target === overlay || event.target.dataset.close !== undefined) {
      closeModal();
    }
  });

  const form = overlay.querySelector('form');
  const submitBtn = form.querySelector('button[type="submit"]');

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Salvando...';

    const valorRealInput = form.valorReal.value;
    const valorReal = valorRealInput === '' ? undefined : Number(valorRealInput);
    const payload = {
      id: idMensal,
      valorReal: Number.isFinite(valorReal) ? valorReal : undefined,
      dataPagamento: form.dataPagamento.value ? new Date(form.dataPagamento.value) : '',
      metodoPagamento: form.metodoPagamento.value.trim(),
      observacoes: form.observacoes.value.trim(),
      pago: form.pago.checked ? 'SIM' : 'NAO',
    };

    const action = form.pago.checked ? 'Pagamento salvo.' : 'Alterações registradas.';

    gasClient
      .atualizarContaMensal(payload)
      .then(() => {
        showToast(action, 'success');
        closeModal();
        carregarContasMes();
      })
      .catch((error) => {
        console.error(error);
        showToast('Falha ao atualizar conta.', 'error');
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Salvar';
      });
  });

  document.body.appendChild(overlay);
}

function statusBadge(conta) {
  const info = statusInfo(conta);
  const span = document.createElement('span');
  span.className = `status-badge status-badge--${info.key}`;
  span.innerHTML = `<strong>${info.label}</strong><small>${info.detail}</small>`;
  return span;
}

function linhaEstadoClass(conta) {
  const pago = String(conta.PAGO || conta.pago || '').toUpperCase() === 'SIM';
  if (pago) return 'linha-pago';
  const vencimento = conta.VENCIMENTO || conta.vencimento;
  const data = vencimento ? new Date(vencimento) : null;
  if (data && !Number.isNaN(data.getTime())) {
    const hoje = new Date();
    hoje.setHours(0, 0, 0, 0);
    const diff = (data - hoje) / (1000 * 60 * 60 * 24);
    if (diff < 0) return 'linha-atrasado';
    if (diff <= 3) return 'linha-vencendo';
  }
  return '';
}

function renderContasMes() {
  const container = document.querySelector(SELECTORS.contasMesTabela);
  if (!container) return;

  const lista = state.datasets.contasMes;
  if (!lista.length) {
    container.innerHTML = '<p class="muted">Nenhuma conta encontrada para os filtros.</p>';
    return;
  }

  const table = document.createElement('table');
  table.className = 'tabela-contas-mes';
  table.innerHTML = `
    <thead>
      <tr>
        <th>Nome</th>
        <th>Categoria</th>
        <th>PF/PJ</th>
        <th>Vencimento</th>
        <th>Previsto</th>
        <th>Pago</th>
        <th>Situação</th>
        <th>Método</th>
        <th>Observações</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody></tbody>
  `;

  const tbody = table.querySelector('tbody');
  lista.forEach((conta) => {
    const tr = document.createElement('tr');
    const linhaClass = linhaEstadoClass(conta);
    if (linhaClass) tr.classList.add(linhaClass);

    const idMensal = conta.ID_MENSAL || conta.id_mensal || conta.idMensal;

    tr.innerHTML = `
      <td>${conta.NOME_CONTA || conta.nomeConta}</td>
      <td>${conta.CATEGORIA || conta.categoria || '—'}</td>
      <td>${conta.TIPO_PESSOA || conta.tipoPessoa || '—'}</td>
      <td>${formatDate(conta.VENCIMENTO || conta.vencimento)}</td>
      <td>${formatCurrency(conta.VALOR_PREVISTO || conta.valorPrevisto)}</td>
      <td>${formatCurrency(conta.VALOR_REAL || conta.valorReal)}</td>
      <td class="status-cell"></td>
      <td>${conta.METODO_PAGAMENTO || conta.metodoPagamento || '—'}</td>
      <td>${conta.OBSERVACOES || conta.observacoes || '—'}</td>
      <td class="acoes-conta"></td>
    `;

    const statusTd = tr.querySelector('.status-cell');
    statusTd.appendChild(statusBadge(conta));

    const actionsTd = tr.querySelector('.acoes-conta');
    const btnEditar = document.createElement('button');
    btnEditar.type = 'button';
    btnEditar.className = 'btn btn-secondary';
    btnEditar.textContent = 'Editar valores';
    btnEditar.addEventListener('click', () => openContaEditor(conta));

    const btnPago = document.createElement('button');
    btnPago.type = 'button';
    btnPago.className = 'btn btn-primary';
    btnPago.textContent = 'Marcar pago';
    btnPago.addEventListener('click', () => openContaEditor(conta, { pagar: true }));
    actionsTd.appendChild(btnEditar);
    actionsTd.appendChild(btnPago);

    tbody.appendChild(tr);
  });

  container.innerHTML = '';
  container.appendChild(table);
}

function obterFiltrosForm() {
  const form = document.getElementById('filtros-contas-mes');
  if (!form) return { ...state.filtros };
  return {
    status: form.status.value,
    tipoPessoa: form.tipoPessoa.value,
    vencimentoInicio: form.vencimentoInicio.value,
    vencimentoFim: form.vencimentoFim.value,
  };
}

function carregarContasFixas() {
  const container = document.querySelector(SELECTORS.contasFixasLista)?.parentElement;
  setLoading(container, true, 'Carregando contas fixas...');
  gasClient
    .listarContasFixas()
    .then((dados) => {
      state.datasets.contasFixas = Array.isArray(dados) ? dados : [];
      renderContasFixas();
    })
    .catch((error) => {
      console.error(error);
      showToast('Erro ao carregar contas fixas.', 'error');
    })
    .finally(() => setLoading(container, false));
}

function carregarContasMes() {
  const filtros = obterFiltrosForm();
  state.filtros = filtros;
  const container = document.getElementById('contas-mes-card');
  setLoading(container, true, 'Atualizando Contas do Mês...');
  gasClient
    .listarContasMes(filtros)
    .then((dados) => {
      state.datasets.contasMes = Array.isArray(dados) ? dados : [];
      renderContasMes();
      updateHomeKpis();
      if (typeof window.renderDashboard === 'function') {
        window.renderDashboard(state.datasets.contasMes);
      }
    })
    .catch((error) => {
      console.error(error);
      showToast('Erro ao carregar contas do mês.', 'error');
    })
    .finally(() => setLoading(container, false));
}

function validarNumero(valor) {
  const numero = Number(valor);
  return Number.isFinite(numero) && numero >= 0;
}

function handleContaFixaSubmit(event) {
  event.preventDefault();
  const form = event.target;

  const payload = {
    nomeConta: form.nomeConta.value.trim(),
    categoria: form.categoria.value.trim(),
    tipoPessoa: form.tipoPessoa.value,
    valorPrevisto: Number(form.valorPrevisto.value),
    diaRecorrencia: Number(form.diaRecorrencia.value),
    metodoPagamento: form.metodoPagamento.value.trim(),
    observacoes: form.observacoes.value.trim(),
  };

  if (!payload.nomeConta || !payload.categoria || !payload.tipoPessoa) {
    showToast('Preencha todos os campos obrigatórios.', 'error');
    return;
  }
  if (!validarNumero(payload.valorPrevisto)) {
    showToast('Valor previsto inválido.', 'error');
    return;
  }
  if (!Number.isInteger(payload.diaRecorrencia) || payload.diaRecorrencia < 1 || payload.diaRecorrencia > 28) {
    showToast('Dia de recorrência deve ficar entre 1 e 28.', 'error');
    return;
  }

  gasClient
    .criarContaFixa(payload)
    .then(() => {
      showToast('Conta fixa cadastrada.', 'success');
      form.reset();
      carregarContasFixas();
    })
    .catch((error) => {
      console.error(error);
      showToast('Erro ao cadastrar conta fixa.', 'error');
    });
}

function handleContaPontualSubmit(event) {
  event.preventDefault();
  const form = event.target;

  const payload = {
    nomeConta: form.nomeConta.value.trim(),
    categoria: form.categoria.value.trim(),
    tipoPessoa: form.tipoPessoa.value,
    valorPrevisto: Number(form.valorPrevisto.value),
    vencimento: form.vencimento.value,
    metodoPagamento: form.metodoPagamento.value.trim(),
    observacoes: form.observacoes.value.trim(),
  };

  if (!payload.nomeConta || !payload.categoria || !payload.tipoPessoa || !payload.vencimento) {
    showToast('Preencha todos os campos obrigatórios.', 'error');
    return;
  }
  if (!validarNumero(payload.valorPrevisto)) {
    showToast('Valor previsto inválido.', 'error');
    return;
  }

  gasClient
    .criarContaPontual(payload)
    .then(() => {
      showToast('Conta pontual criada em Contas do Mês.', 'success');
      form.reset();
      carregarContasMes();
    })
    .catch((error) => {
      console.error(error);
      showToast('Erro ao cadastrar conta pontual.', 'error');
    });
}

function setupForms() {
  const formContaFixa = document.getElementById('form-conta-fixa');
  const formContaPontual = document.getElementById('form-conta-pontual');
  const filtrosForm = document.getElementById('filtros-contas-mes');

  formContaFixa?.addEventListener('submit', handleContaFixaSubmit);
  formContaPontual?.addEventListener('submit', handleContaPontualSubmit);
  filtrosForm?.addEventListener('submit', (event) => {
    event.preventDefault();
    carregarContasMes();
  });
}

function setupActions() {
  const gerarMesBtn = document.querySelector('[data-action="gerar-mes"]');
  const refreshMesBtn = document.querySelector('[data-action="atualizar-contas-mes"]');
  const dashboardRefreshBtn = document.querySelector('[data-action="dashboard-refresh"]');

  gerarMesBtn?.addEventListener('click', () => {
    gasClient
      .gerarMes()
      .then(() => {
        showToast('Mês gerado com sucesso.', 'success');
        carregarContasMes();
      })
      .catch((error) => {
        console.error(error);
        showToast('Falha ao gerar mês.', 'error');
      });
  });

  refreshMesBtn?.addEventListener('click', () => carregarContasMes());
  dashboardRefreshBtn?.addEventListener('click', () => carregarContasMes());
}

function initApp() {
  setupRouting();
  setupForms();
  setupActions();
  carregarContasFixas();
  carregarContasMes();
}

document.addEventListener('DOMContentLoaded', initApp);

window.gasClient = gasClient;
window.state = state;
window.carregarContasMes = carregarContasMes;
window.carregarContasFixas = carregarContasFixas;
window.openContaEditor = openContaEditor;
</script>
