<div id="dashboard-root" class="dashboard-root">
  <div id="kpi-grid" class="kpi-grid"></div>
  <div id="chart-grid" class="chart-grid"></div>
</div>

<style>
  .dashboard-root {
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding: 16px;
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
  }

  .chart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px;
  }

  .dashboard-card {
    background: #0b1224;
    border: 1px solid #1f2937;
    border-radius: 12px;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25);
    color: #e5e7eb;
  }

  .kpi-card {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .kpi-label {
    font-size: 12px;
    color: #9ca3af;
  }

  .kpi-value {
    font-size: 20px;
    font-weight: 700;
  }

  .chart-card {
    padding: 12px 12px 6px 12px;
  }

  .chart-title {
    font-weight: 600;
    margin-bottom: 8px;
  }

  .chart-canvas {
    width: 100%;
    height: 240px;
  }
</style>

<script>
  (function () {
    const COLORS = ['#2563eb', '#16a34a', '#f97316', '#e11d48', '#8b5cf6', '#0ea5e9'];

    const currencyFormatter = new Intl.NumberFormat('pt-BR', {
      style: 'currency',
      currency: 'BRL',
      minimumFractionDigits: 2,
    });

    function parseNumber(value) {
      if (typeof value === 'number') return value;
      if (!value) return 0;
      const sanitized = String(value).replace(/[^0-9,-]/g, '').replace(',', '.');
      const parsed = Number.parseFloat(sanitized);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function parseDate(value) {
      if (!value) return null;
      if (value instanceof Date) return value;
      const parts = String(value).split(/[\/-]/);
      if (parts.length === 3 && parts[0].length === 2) {
        const [d, m, y] = parts.map((p) => Number.parseInt(p, 10));
        return new Date(y, m - 1, d);
      }
      if (parts.length === 3 && parts[0].length === 4) {
        const [y, m, d] = parts.map((p) => Number.parseInt(p, 10));
        return new Date(y, m - 1, d);
      }
      const parsed = new Date(value);
      return Number.isNaN(parsed.getTime()) ? null : parsed;
    }

    function isPaid(record) {
      const pago = (record.PAGO || record.pago || '').toString().toUpperCase();
      return pago === 'SIM' || pago === 'TRUE' || pago === 'PAGO' || pago === 'YES';
    }

    function isLate(record) {
      const atrasado = (record.ATRASADO || record.atrasado || '').toString().toUpperCase();
      if (atrasado === 'SIM' || atrasado === 'TRUE') return true;
      const due = parseDate(record.VENCIMENTO || record.vencimento);
      if (!due || isPaid(record)) return false;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return due < today;
    }

    function isDueSoon(record, days = 5) {
      const due = parseDate(record.VENCIMENTO || record.vencimento);
      if (!due || isPaid(record)) return false;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const diffDays = (due - today) / (1000 * 60 * 60 * 24);
      return diffDays >= 0 && diffDays <= days;
    }

    function getValuePrevisto(record) {
      return parseNumber(record.VALOR_PREVISTO || record.valorPrevisto || record.valor_previsto);
    }

    function getValuePago(record) {
      const valorReal = parseNumber(record.VALOR_REAL || record.valorReal || record.valor_real);
      return isPaid(record) && valorReal ? valorReal : 0;
    }

    function aggregateData(records) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const kpis = {
        totalPrevisto: 0,
        totalPago: 0,
        totalEmAberto: 0,
        contasAtrasadas: 0,
        contasVencendo: 0,
      };

      const pfPj = { PF: 0, PJ: 0 };
      const categorias = new Map();
      const metodos = new Map();
      const mensal = new Map();

      records.forEach((item) => {
        const previsto = getValuePrevisto(item);
        const pago = getValuePago(item);

        kpis.totalPrevisto += previsto;
        kpis.totalPago += pago;

        if (!isPaid(item)) {
          kpis.totalEmAberto += previsto;
        }

        if (isLate(item)) {
          kpis.contasAtrasadas += 1;
        } else if (isDueSoon(item)) {
          kpis.contasVencendo += 1;
        }

        const tipo = (item.TIPO_PESSOA || item.tipoPessoa || '').toString().toUpperCase();
        if (tipo === 'PF' || tipo === 'PJ') {
          pfPj[tipo] += previsto;
        }

        const categoria = (item.CATEGORIA || item.categoria || 'Outros').toString();
        categorias.set(categoria, (categorias.get(categoria) || 0) + previsto);

        const metodo = (item.METODO_PAGAMENTO || item.metodoPagamento || 'Não definido').toString();
        metodos.set(metodo, (metodos.get(metodo) || 0) + pago);

        const dueDate = parseDate(item.VENCIMENTO || item.vencimento || today);
        if (dueDate) {
          const key = `${dueDate.getFullYear()}-${String(dueDate.getMonth() + 1).padStart(2, '0')}`;
          const monthly = mensal.get(key) || { previsto: 0, pago: 0 };
          monthly.previsto += previsto;
          monthly.pago += pago;
          mensal.set(key, monthly);
        }
      });

      return { kpis, pfPj, categorias, metodos, mensal };
    }

    function ensureContainers() {
      const root = document.getElementById('dashboard-root');
      if (!root) {
        const newRoot = document.createElement('div');
        newRoot.id = 'dashboard-root';
        newRoot.className = 'dashboard-root';
        newRoot.innerHTML = `
          <div id="kpi-grid" class="kpi-grid"></div>
          <div id="chart-grid" class="chart-grid"></div>
        `;
        document.body.appendChild(newRoot);
      }

      const kpiGrid = document.getElementById('kpi-grid');
      const chartGrid = document.getElementById('chart-grid');

      if (!kpiGrid || !chartGrid) {
        const container = document.getElementById('dashboard-root');
        container.innerHTML = `
          <div id="kpi-grid" class="kpi-grid"></div>
          <div id="chart-grid" class="chart-grid"></div>
        `;
      }

      const chartGridElement = document.getElementById('chart-grid');
      if (chartGridElement && chartGridElement.children.length === 0) {
        const charts = [
          { id: 'pfpj-chart', title: 'PF vs PJ', type: 'bar' },
          { id: 'categorias-chart', title: 'Categorias', type: 'pie' },
          { id: 'mensal-chart', title: 'Evolução Mensal', type: 'line' },
          { id: 'metodos-chart', title: 'Métodos de Pagamento', type: 'bar' },
        ];

        charts.forEach((chart) => {
          const card = document.createElement('div');
          card.className = 'dashboard-card chart-card';

          const title = document.createElement('div');
          title.textContent = chart.title;
          title.className = 'chart-title';
          card.appendChild(title);

          const canvas = document.createElement('canvas');
          canvas.id = chart.id;
          canvas.width = 360;
          canvas.height = 240;
          canvas.className = 'chart-canvas';
          card.appendChild(canvas);

          chartGridElement.appendChild(card);
        });
      }
    }

    function renderKPIs(kpis) {
      const container = document.getElementById('kpi-grid');
      container.innerHTML = '';

      const entries = [
        { label: 'Total previsto', value: kpis.totalPrevisto },
        { label: 'Total pago', value: kpis.totalPago },
        { label: 'Total em aberto', value: kpis.totalEmAberto },
        { label: 'Contas atrasadas', value: kpis.contasAtrasadas, isCount: true },
        { label: 'Contas vencendo', value: kpis.contasVencendo, isCount: true },
      ];

      entries.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'dashboard-card kpi-card';

        const label = document.createElement('div');
        label.textContent = item.label;
        label.className = 'kpi-label';

        const value = document.createElement('div');
        value.textContent = item.isCount ? item.value : currencyFormatter.format(item.value);
        value.className = 'kpi-value';

        card.appendChild(label);
        card.appendChild(value);
        container.appendChild(card);
      });
    }

    function drawPieChart(canvas, data) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const entries = Array.from(data.entries());
      const total = entries.reduce((sum, [, value]) => sum + value, 0) || 1;
      let startAngle = -Math.PI / 2;

      entries.forEach(([label, value], index) => {
        const angle = (value / total) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, canvas.height / 2);
        ctx.arc(
          canvas.width / 2,
          canvas.height / 2,
          Math.min(canvas.width, canvas.height) / 2 - 20,
          startAngle,
          startAngle + angle
        );
        ctx.closePath();
        ctx.fillStyle = COLORS[index % COLORS.length];
        ctx.fill();
        startAngle += angle;
      });

      const legendX = canvas.width - 130;
      let legendY = 20;
      ctx.font = '12px sans-serif';
      entries.forEach(([label, value], index) => {
        ctx.fillStyle = COLORS[index % COLORS.length];
        ctx.fillRect(legendX, legendY, 10, 10);
        ctx.fillStyle = '#e5e7eb';
        ctx.fillText(`${label} (${currencyFormatter.format(value)})`, legendX + 14, legendY + 10);
        legendY += 16;
      });
    }

    function drawBarChart(canvas, labels, values) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const padding = 32;
      const chartHeight = canvas.height - padding * 2;
      const chartWidth = canvas.width - padding * 2;
      const maxValue = Math.max(...values, 1);
      const barWidth = chartWidth / values.length - 12;

      ctx.strokeStyle = '#1f2937';
      ctx.beginPath();
      ctx.moveTo(padding, padding / 2);
      ctx.lineTo(padding, canvas.height - padding);
      ctx.lineTo(canvas.width - padding / 2, canvas.height - padding);
      ctx.stroke();

      values.forEach((value, index) => {
        const x = padding + index * (barWidth + 12);
        const height = (value / maxValue) * chartHeight;
        const y = canvas.height - padding - height;
        ctx.fillStyle = COLORS[index % COLORS.length];
        ctx.fillRect(x, y, barWidth, height);
        ctx.fillStyle = '#e5e7eb';
        ctx.font = '12px sans-serif';
        ctx.fillText(labels[index], x, canvas.height - padding + 14);
        ctx.fillText(currencyFormatter.format(value), x, y - 6);
      });
    }

    function drawLineChart(canvas, labels, previsto, pago) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const padding = 40;
      const chartHeight = canvas.height - padding * 2;
      const chartWidth = canvas.width - padding * 2;
      const maxValue = Math.max(...previsto, ...pago, 1);

      ctx.strokeStyle = '#1f2937';
      ctx.beginPath();
      ctx.moveTo(padding, padding / 2);
      ctx.lineTo(padding, canvas.height - padding);
      ctx.lineTo(canvas.width - padding / 2, canvas.height - padding);
      ctx.stroke();

      function plotLine(data, color) {
        ctx.beginPath();
        data.forEach((value, index) => {
          const x = padding + (index / Math.max(labels.length - 1, 1)) * chartWidth;
          const y = canvas.height - padding - (value / maxValue) * chartHeight;
          if (index === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        });
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      plotLine(previsto, COLORS[0]);
      plotLine(pago, COLORS[1]);

      ctx.fillStyle = '#e5e7eb';
      ctx.font = '12px sans-serif';
      labels.forEach((label, index) => {
        const x = padding + (index / Math.max(labels.length - 1, 1)) * chartWidth;
        ctx.fillText(label, x - 10, canvas.height - padding + 16);
      });

      ctx.fillStyle = COLORS[0];
      ctx.fillRect(canvas.width - 150, padding / 2, 10, 10);
      ctx.fillStyle = '#e5e7eb';
      ctx.fillText('Previsto', canvas.width - 134, padding / 2 + 10);
      ctx.fillStyle = COLORS[1];
      ctx.fillRect(canvas.width - 80, padding / 2, 10, 10);
      ctx.fillStyle = '#e5e7eb';
      ctx.fillText('Pago', canvas.width - 64, padding / 2 + 10);
    }

    function renderCharts(aggregated) {
      const pfLabels = ['PF', 'PJ'];
      const pfValues = [aggregated.pfPj.PF, aggregated.pfPj.PJ];
      drawBarChart(document.getElementById('pfpj-chart'), pfLabels, pfValues);

      drawPieChart(document.getElementById('categorias-chart'), aggregated.categorias);

      const mensalEntries = Array.from(aggregated.mensal.entries()).sort(([a], [b]) => (a > b ? 1 : -1));
      const mensalLabels = mensalEntries.map(([key]) => key);
      const previsto = mensalEntries.map(([, value]) => value.previsto);
      const pago = mensalEntries.map(([, value]) => value.pago);
      drawLineChart(document.getElementById('mensal-chart'), mensalLabels, previsto, pago);

      const metodoEntries = Array.from(aggregated.metodos.entries());
      const metodoLabels = metodoEntries.map(([label]) => label);
      const metodoValues = metodoEntries.map(([, value]) => value);
      drawBarChart(document.getElementById('metodos-chart'), metodoLabels, metodoValues);
    }

    function renderDashboard(records) {
      ensureContainers();
      const aggregated = aggregateData(records || []);
      renderKPIs(aggregated.kpis);
      renderCharts(aggregated);
    }

    function loadDashboard() {
      if (window.google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(renderDashboard).listarContasMes();
      } else {
        console.warn('google.script.run não disponível. Use renderDashboard(dados) manualmente.');
      }
    }

    window.renderDashboard = renderDashboard;
    window.loadDashboard = loadDashboard;
  })();
</script>
