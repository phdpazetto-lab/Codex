<!-- Tabela de Contas do Mês. Renderização e chamadas estão em webapp/app.js -->
<section class="card" id="contas-mes-card">
  <div class="card-header row-between">
    <div>
      <h2>Contas do mês</h2>
      <p class="muted">Visão consolidada com filtros, pagamento rápido e geração do mês.</p>
    </div>
    <div class="inline-actions">
      <button type="button" class="btn" data-action="gerar-mes">Gerar mês agora</button>
      <button type="button" class="btn btn-secondary" data-action="atualizar-contas-mes">Atualizar lista</button>
    </div>
  </div>

  <form id="filtros-contas-mes" class="filters-grid">
    <div class="form-field">
      <label for="filtroStatus">Status</label>
      <select id="filtroStatus" name="status">
        <option value="">Todos</option>
        <option value="PENDENTE">Em aberto</option>
        <option value="PAGO">Pago</option>
        <option value="ATRASADO">Atrasado</option>
      </select>
    </div>
    <div class="form-field">
      <label for="filtroTipoPessoa">Tipo de pessoa</label>
      <select id="filtroTipoPessoa" name="tipoPessoa">
        <option value="">PF e PJ</option>
        <option value="PF">PF</option>
        <option value="PJ">PJ</option>
      </select>
    </div>
    <div class="form-field">
      <label for="filtroVencInicio">Vencimento inicial</label>
      <input type="date" id="filtroVencInicio" name="vencimentoInicio" />
    </div>
    <div class="form-field">
      <label for="filtroVencFim">Vencimento final</label>
      <input type="date" id="filtroVencFim" name="vencimentoFim" />
    </div>
    <div class="form-actions full-row">
      <button type="submit" class="btn btn-primary">Aplicar filtros</button>
    </div>
  </form>

  <div id="tabela-contas-mes" class="tabela-scroll" data-contas-mes></div>
</section>
